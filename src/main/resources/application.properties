spring.application.name=FitnessTrackApp

server.port=8080
jwt.access.secret=${JWT_ACCESS_SECRET:${random.uuid}${random.uuid}}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900000}

jwt.refresh.secret=${JWT_REFRESH_SECRET:${random.uuid}${random.uuid}}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Neon Postgres configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fitness_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Hosted OpenFoodFacts Lite API
openfoodfacts.base-url=${OPENFOODFACTS_BASE_URL:https://off.brndndiaz.dev}

# Public exercise library API
wger.base-url=${WGER_BASE_URL:https://wger.de/api/v2}

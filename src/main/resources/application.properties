spring.application.name=FitnessTrackApp

server.port=8080
jwt.access.secret=${JWT_ACCESS_SECRET:${random.uuid}${random.uuid}}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900000}

jwt.refresh.secret=${JWT_REFRESH_SECRET:${random.uuid}${random.uuid}}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}
auth.cookies.access-token-name=${AUTH_ACCESS_COOKIE_NAME:ACCESS_TOKEN}
auth.cookies.refresh-token-name=${AUTH_REFRESH_COOKIE_NAME:REFRESH_TOKEN}
auth.cookies.secure=${AUTH_COOKIE_SECURE:false}
auth.cookies.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Neon Postgres configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fitness_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/fitness_app}
spring.data.redis.repositories.enabled=false
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Public exercise library API
wger.base-url=${WGER_BASE_URL:https://wger.de/api/v2}
openfoodfacts.official-base-url=${OPENFOODFACTS_OFFICIAL_BASE_URL:https://world.openfoodfacts.org/api/v2}
openfoodfacts.search-base-url=${OPENFOODFACTS_SEARCH_BASE_URL:https://search.openfoodfacts.org}
openfoodfacts.user-agent=${OPENFOODFACTS_USER_AGENT:DarkLift/1.0 (https://darklift.app)}

# Transactional email
mail.resend.api-key=${RESEND_API_KEY:}
mail.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
mail.from=${MAIL_FROM:DarkLift <noreply@darklift.app>}
mail.enabled=${MAIL_ENABLED:true}
mail.debug=${MAIL_DEBUG:false}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.public-frontend-url=${APP_PUBLIC_FRONTEND_URL:https://darklift.app}
app.local-frontend-url=${APP_LOCAL_FRONTEND_URL:http://localhost:3000}
auth.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
auth.account-deletion.purge-cron=${ACCOUNT_DELETION_PURGE_CRON:0 0 3 * * *}

stages:
  - build
  - test
  - build-sonar
  - docker

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  GIT_DEPTH: "0"
  COOLIFY_WEBHOOK: "$COOLIFY_WEBHOOK"

before_script:
  - export JAVA_HOME=$(/usr/libexec/java_home -v 21)
  - export PATH="$JAVA_HOME/bin:$PATH"
  - java -version
  - chmod +x ./gradlew
  - mkdir -p "$GRADLE_USER_HOME"
  - ./gradlew --no-daemon --version

build:
  stage: build
  script:
    - ./gradlew --no-daemon classes
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_BRANCH == "Development"'

test:
  stage: test
  script:
    - ./gradlew --no-daemon test jacocoTestReport jacocoTestCoverageVerification
  artifacts:
    when: always
    paths:
      - build/classes/java/main/
      - build/resources/main/
      - build/reports/tests/test/
      - build/reports/jacoco/test/html/
      - build/reports/jacoco/test/jacocoTestReport.xml
    expire_in: 4 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_BRANCH == "Development"'

build-sonar:
  stage: build-sonar
  needs:
    - job: test
      artifacts: true
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "$SONAR_USER_HOME/cache"
  script:
    - echo "SONAR_TOKEN exists? ${SONAR_TOKEN:+yes}"
    - ls -la build/reports/jacoco/test/
    - ./gradlew --no-daemon test jacocoTestReport jacocoTestCoverageVerification sonar -Dsonar.token="$SONAR_TOKEN" -Dsonar.qualitygate.wait="${SONAR_QUALITYGATE_WAIT:-false}"
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_BRANCH == "Development"'

docker:
  stage: docker
  script:
    - ./gradlew --no-daemon bootJar

    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

    - docker build -t kamiwaza01/fitnessappbackend:latest .

    - docker push kamiwaza01/fitnessappbackend:latest

    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "Triggering Coolify deployment"
        curl -fsSL "$COOLIFY_WEBHOOK"
      else
        echo "Skipping Coolify deployment for $CI_COMMIT_BRANCH"
      fi

  artifacts:
    paths:
      - build/libs/
    expire_in: 4 weeks

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

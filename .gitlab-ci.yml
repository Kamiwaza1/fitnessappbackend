stages:
  - build
  - test
  - build-sonar
  - docker
  - production

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  GIT_DEPTH: "0"
  COOLIFY_WEBHOOK: "$COOLIFY_WEBHOOK"

before_script:
  - |
    if command -v /usr/libexec/java_home >/dev/null 2>&1; then
      export JAVA_HOME=$(/usr/libexec/java_home -v 21)
      export PATH="$JAVA_HOME/bin:$PATH"
    fi
  - java -version
  - chmod +x ./gradlew
  - mkdir -p "$GRADLE_USER_HOME"
  - ./gradlew --no-daemon --version

.run_on_branches_and_merge_requests:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

.run_on_main:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

build:
  stage: build
  extends: .run_on_branches_and_merge_requests
  script:
    - ./gradlew --no-daemon classes
  artifacts:
    when: on_success
    paths:
      - build/classes/java/main/
      - build/resources/main/
    expire_in: 1 week

test:
  stage: test
  extends: .run_on_branches_and_merge_requests
  needs:
    - job: build
      artifacts: true
  script:
    - ./gradlew --no-daemon test jacocoTestReport jacocoTestCoverageVerification
  artifacts:
    when: always
    paths:
      - build/classes/java/main/
      - build/resources/main/
      - build/reports/tests/test/
      - build/reports/jacoco/test/html/
      - build/reports/jacoco/test/jacocoTestReport.xml
    expire_in: 4 weeks

build-sonar:
  stage: build-sonar
  extends: .run_on_branches_and_merge_requests
  needs:
    - job: test
      artifacts: true
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "$SONAR_USER_HOME/cache"
  script:
    - echo "SONAR_TOKEN exists? ${SONAR_TOKEN:+yes}"
    - ls -la build/reports/jacoco/test/
    - ./gradlew --no-daemon sonar -Dsonar.token="$SONAR_TOKEN" -Dsonar.qualitygate.wait="${SONAR_QUALITYGATE_WAIT:-true}"
  allow_failure: false

docker:
  stage: docker
  extends: .run_on_main
  script:
    - ./gradlew --no-daemon bootJar

    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

    - docker buildx create --use --name multiarch-builder || docker buildx use multiarch-builder

    - |
      docker buildx build \
        --platform linux/amd64 \
        -t kamiwaza01/fitnessappbackend:latest \
        --push \
        .

production:
  stage: production
  extends: .run_on_main
  needs:
    - job: docker
  script:
    - echo "Triggering Coolify deployment"
    - curl -fsSL -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"

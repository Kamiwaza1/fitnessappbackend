stages:
  - build
  - test
  - quality
  - build-sonar
  - docker

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home/$CI_JOB_ID"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

before_script:
  - java -version
  - chmod +x ./gradlew
  - mkdir -p "$GRADLE_USER_HOME"
  - ./gradlew --no-daemon --version

quality:
  stage: quality
  script:
    - ./gradlew --no-daemon check

test:
  stage: test
  script:
    - ./gradlew --no-daemon test
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
    expire_in: 4 week

build:
  stage: build
  script:
    - ./gradlew --no-daemon classes

docker:
  stage: docker
  script:
    - docker compose up --build -d
  artifacts:
    paths:
      - build/libs/
    expire_in: 4 week


sonarqube-check-backend:
  stage: quality
  script:
    - ./gradlew jacocoTestReport sonarqube --no-daemon

build-sonar:
  image: gradle:8.10.0-jdk17-jammy
  stage: build-sonar
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - gradle sonar
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'Auth'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'Development'
    - if: $CI_COMMIT_BRANCH == 'Workouts'
    - if: $CI_COMMIT_BRANCH == 'Nutrition'

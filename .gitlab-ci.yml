stages:
  - quality
  - test
  - build
  - package
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

before_script:
  - java -version
  - ./gradlew --version

quality:
  stage: quality
  script:
    - ./gradlew --no-daemon check

test:
  stage: test
  script:
    - ./gradlew --no-daemon test
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
    expire_in: 1 week

build:
  stage: build
  script:
    - ./gradlew --no-daemon classes

package:
  stage: package
  script:
    - ./gradlew --no-daemon bootJar
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 week

deploy:
  stage: deploy
  script:
    - echo "Deploy step here"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
stages:
  - build
  - test
  - quality
  - docker

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

before_script:
  - java -version
  - chmod +x ./gradlew
  - mkdir -p "$GRADLE_USER_HOME"
  - ./gradlew --version || (rm -rf "$GRADLE_USER_HOME/wrapper/dists" && ./gradlew --version)

quality:
  stage: quality
  script:
    - ./gradlew --no-daemon check

test:
  stage: test
  script:
    - ./gradlew --no-daemon test
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
    expire_in: 1 week

build:
  stage: build
  script:
    - ./gradlew --no-daemon classes

docker:
  stage: docker
  script:
    - docker compose up --build -d
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 week


sonarqube-check-backend:
  stage: quality
  script:
    - ./gradlew jacocoTestReport sonarqube --no-daemon

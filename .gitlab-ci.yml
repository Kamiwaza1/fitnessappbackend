default:
  hooks:
    pre_get_sources_script:
      - $env:GIT_CONFIG_NOSYSTEM=''

stages:
  - test
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: gradle-cache
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - java -version
  - .\gradlew.bat --version

test:
  stage: test
  script:
    - .\gradlew.bat test
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
    expire_in: 1 week

build:
  stage: build
  script:
    - .\gradlew.bat clean bootJar -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week
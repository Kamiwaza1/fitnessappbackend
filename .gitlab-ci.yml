stages:
  - build
  - test
  - build-sonar
  - docker

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  GIT_DEPTH: "0"

before_script:
  - java -version
  - chmod +x ./gradlew
  - mkdir -p "$GRADLE_USER_HOME"
  - ./gradlew --no-daemon --version

build:
  stage: build
  script:
    - ./gradlew --no-daemon classes

test:
  stage: test
  script:
    - ./gradlew --no-daemon test jacocoTestReport
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
      - build/reports/jacoco/test/html/
      - build/reports/jacoco/test/jacocoTestReport.xml
    expire_in: 4 weeks

build-sonar:
  stage: build-sonar
  needs:
    - job: test
      artifacts: true
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "$SONAR_USER_HOME/cache"
  script:
      - echo "SONAR_TOKEN exists? ${SONAR_TOKEN:+yes}"
      - ./gradlew --no-daemon sonar -Dsonar.token="$SONAR_TOKEN"
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "Auth"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "Development"'
    - if: '$CI_COMMIT_BRANCH == "Workouts"'
    - if: '$CI_COMMIT_BRANCH == "Nutrition"'

docker:
  stage: docker
  script:
    - docker compose up --build -d
  artifacts:
    paths:
      - build/libs/
    expire_in: 4 weeks
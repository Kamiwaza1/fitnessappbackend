stages: 
  - validate
  - test
  - build
  - security
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

before_script:
  - java -version
  - ./gradlew --version

test:
  stage: test
  script:
    - ./gradlew --no-daemon test
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
    expire_in: 1 week

build:
  stage: build
  script:
    - ./gradlew --no-daemon build